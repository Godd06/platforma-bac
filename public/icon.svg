<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: brand dark navy, rounded corners via clipPath -->
  <defs>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="112" ry="112" fill="#070d14"/>

  <!-- Open book left page -->
  <g clip-path="url(#rounded)" stroke="#06b6d4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Book spine -->
    <line x1="256" y1="158" x2="256" y2="354" stroke-width="20"/>

    <!-- Left page top arc -->
    <path d="M256,158 C248,148 172,160 172,210" stroke-width="18"/>
    <!-- Left page body -->
    <path d="M172,210 C172,270 220,320 256,354" stroke-width="18"/>

    <!-- Right page top arc -->
    <path d="M256,158 C264,148 340,160 340,210" stroke-width="18"/>
    <!-- Right page body -->
    <path d="M340,210 C340,270 292,320 256,354" stroke-width="18"/>

    <!-- Left page lines -->
    <line x1="192" y1="220" x2="240" y2="218" stroke-width="12"/>
    <line x1="190" y1="244" x2="238" y2="240" stroke-width="12"/>
    <line x1="188" y1="268" x2="234" y2="262" stroke-width="12"/>

    <!-- Checkmark on right page -->
    <polyline points="266,280 286,306 328,248" stroke-width="22" stroke="#06b6d4"/>
  </g>
</svg>
